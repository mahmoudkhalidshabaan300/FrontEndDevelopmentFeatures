08)**Syntax And Tests =>
08.1)**The Value Of Different Attributes Must Be Inside Single Quotations , Or Double Quotations , Because The Value Of Any HTML Attributes If More Than One Word , Do Not Put The Value Of This HTML Attribute Inside Single Quotations , Or Double Quotations , Because Different Browsers Like Google Chrome , Firefox Developer Edition , Or ETC Takes The Frist Word From The Value As The Value Of The HTML Attribute , And Makes Other Words As A New Different HTML Attributes , But If The Value Of The HTML Attributes Put Inside Single Quotation , Or Double Quotation , Different Browsers Takes All Words As The Value Of The HTML Attribute...

-->
