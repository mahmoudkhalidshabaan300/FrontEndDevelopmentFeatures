<!-- 
06)**Quirks Mode , Or Doctype Mode =>
06.1)**Any HTML Document (Own Web Page) Renders , Or Archives By Any Browsers Like Google Chrome , Firefox Developer Edition , Or ETC By One Of Two Different Modes Like:
06.1.1)**Quirks Mode If The Developer Of Your Own HTML Document (Own Web Page) Does Not Determine The DOCTYPE Of Your Own HTML Document (Own Web Page)...
06.1.2)**Doctype Mode If The Developer Of Your Own HTML Document (Own Web Page) Determines The DOCTYPE Of Your Own HTML Document (Own Web Page)... , And There Different Modes Of The DOCTYPE Mode Like:
    06.1.2.1)**In The HTML Version 4 , The Line Of The DOCTYPE Is : <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN"
    "https://www.w3.org/TR/html4/frameset.dtd">...
    06.1.2.2)**In The HTML Version 5 , The Line Of The DOCTYPE Is : <!DOCTYPE HTML>...
06.2)**When Your Own HTML Document (Own Web Page) Renders , Or Archives By Using HTML Version 5 (<!DOCTYPE html>) , Different HTML Tags Appear In Your Own HTML Document (Own Web Page) With Different Features...
06.3)**When Your Own HTML Document (Own Web Page) Renders , Or Archive By Using The Quirks Mode , Different HTML Tags Do Not Appear In Your Own HTML Document (Own Web Page) With Different Features...
-->
<!-- <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN" "https://www.w3.org/TR/html4/frameset.dtd"> -->
<!DOCTYPE HTML>
<html>
    <head>
        <title>StandardAndQuirksMode...</title>
    </head>
    <body>
        DOCTYPE Mode:
        HTML Version 4: There Is A Code...
        HTML Version 5: There Is Different Code Than HTML Version 4...
        QUIRKS Mode...
    </body>
</html>
